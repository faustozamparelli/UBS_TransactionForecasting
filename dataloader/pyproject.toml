[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubs-forecast-dataloader"
version = "0.1.0"
description = "Recurring-merchant label loading and dataset pairing for the forecasting model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["txlabels"]
